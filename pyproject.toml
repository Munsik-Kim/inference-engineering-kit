[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-engineering-kit"
version = "0.1.0"
description = "Reusable inference experiment and evidence toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
http = ["aiohttp>=3.9,<4"]

[project.scripts]
inference-kit = "inference_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inference_kit = ["resources/*.json", "_vendor/diova_compare/LICENSE"]
