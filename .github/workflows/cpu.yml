name: Manual CPU contracts and wheel consumer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified official tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, verified official tag
        with:
          python-version: '3.12'
      - name: Isolated CPU build and HTTP test dependency
        run: python -m pip install setuptools wheel aiohttp
      - name: Contracts (no model/GPU/download)
        run: PYTHONPATH=src python -B tools/test_cpu.py --output "$RUNNER_TEMP/tests.json"
      - name: Wheel and independent consumer
        run: |
          python -c "import setuptools.build_meta as b;b.build_wheel('dist')"
          python -m venv "$RUNNER_TEMP/consumer-venv"
          "$RUNNER_TEMP/consumer-venv/bin/python" -m pip install --no-deps dist/*.whl
          env -u PYTHONPATH -u PYTHONHOME "$RUNNER_TEMP/consumer-venv/bin/python" -I -B tools/consumer_check.py --workspace "$RUNNER_TEMP/consumer-work" --fixture "$GITHUB_WORKSPACE/tests/fixtures/recorded-step04" --example "$GITHUB_WORKSPACE/examples/consumer_project.py" --forbidden-root "$GITHUB_WORKSPACE"
