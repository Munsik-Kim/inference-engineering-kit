name: Manual CPU contracts and wheel consumer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official tag verified 2026-10-16; Node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, official tag verified 2026-10-16; Node24
        with:
          python-version: ${{ matrix.python }}
      - name: CPU build and HTTP test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/cpu-evidence"
          python -m pip install 'setuptools>=77,<85' 'wheel>=0.45,<0.49' 'aiohttp>=3.9,<4'
          python -m pip list --format=json > "$RUNNER_TEMP/cpu-evidence/build-dependencies.json"
      - name: Source CPU contracts
        run: PYTHONPATH=src python -B tools/test_cpu.py --output "$RUNNER_TEMP/cpu-evidence/source-tests.json"
      - name: Build wheel and sdist
        run: |
          python -c "import setuptools.build_meta as b;b.build_wheel('dist');b.build_sdist('dist')"
          python -m pip wheel --no-index --no-deps --no-build-isolation dist/*.tar.gz --wheel-dir "$RUNNER_TEMP/sdist-wheel"
      - name: Clean base wheel consumer
        run: |
          python -m venv "$RUNNER_TEMP/consumer-venv"
          "$RUNNER_TEMP/consumer-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/consumer-venv/bin/python" -m pip check
          env -u PYTHONPATH -u PYTHONHOME "$RUNNER_TEMP/consumer-venv/bin/python" -I -B tools/consumer_check.py --workspace "$RUNNER_TEMP/consumer-work" --fixture "$GITHUB_WORKSPACE/tests/fixtures/recorded-step04" --example "$GITHUB_WORKSPACE/examples/consumer_project.py" --forbidden-root "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/consumer-work/CONSUMER_RECEIPT.json" "$RUNNER_TEMP/cpu-evidence/"
      - name: CPU contracts against installed wheel with HTTP dependency
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/wheel-tests-venv"
          "$RUNNER_TEMP/wheel-tests-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          env -u PYTHONPATH -u PYTHONHOME "$RUNNER_TEMP/wheel-tests-venv/bin/python" -I -B tools/test_cpu.py --output "$RUNNER_TEMP/cpu-evidence/wheel-tests.json"
          "$RUNNER_TEMP/wheel-tests-venv/bin/python" -I - <<'PY'
          import json,os,pathlib,sys
          record=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'cpu-evidence/wheel-tests.json').read_text(encoding='utf-8'))
          assert record['test_invocations']>0 and record['successful']
          assert pathlib.Path(record['package_import_origin']).is_relative_to(pathlib.Path(sys.prefix))
          PY
      - name: Compare code and resources from wheel and sdist build
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          direct=next(pathlib.Path('dist').glob('*.whl'))
          rebuilt=next((pathlib.Path(os.environ['RUNNER_TEMP'])/'sdist-wheel').glob('*.whl'))
          with zipfile.ZipFile(direct) as a,zipfile.ZipFile(rebuilt) as b:
              left={n:a.read(n) for n in a.namelist() if n.startswith('inference_kit/')}
              right={n:b.read(n) for n in b.namelist() if n.startswith('inference_kit/')}
          assert left and left==right
          value={'status':'SDIST_PACKAGE_BYTES_MATCH','package_members':len(left),'direct_wheel_sha256':hashlib.sha256(direct.read_bytes()).hexdigest(),'sdist_wheel_sha256':hashlib.sha256(rebuilt.read_bytes()).hexdigest(),'archive_metadata_identity':'separate'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'cpu-evidence/sdist-parity.json').write_text(json.dumps(value,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Retain CPU receipts and built wheel, including failed run receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, official tag verified 2026-10-15; Node24
        with:
          name: cpu-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cpu-evidence/
            dist/*.whl
          if-no-files-found: warn
          retention-days: 7
